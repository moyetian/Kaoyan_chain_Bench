# smoke.yml —— PR / push 冒烟门禁 + 回归门禁（任务 C-04，DoD ★12）
# 内容：
#   1. run --suite smoke --agent mock（6 题，全离线，秒级）
#   2. 产出报告（json/markdown/html/csv）
#   3. 回归门禁 kaoyanbench regression（与 benchmark/baselines/ 入库基线比对；
#      基线缺失即 ::error:: + exit 2，严禁自比对）
#
# ★ 回归门禁失败时 job 必须失败（方案第 33 节 / 5.5）：
#     Task Success 降 >5pp / Citation Accuracy 降 >5pp / Hallucination Rate 升 >3pp → exit 1 → job FAIL。
#   本 workflow 直接依赖 `kaoyanbench regression` 的退出码（0 pass / 1 gate fail / 2 错误），
#   不使用 `|| true` 吞掉失败。
#
# ★ R9：基线仅在 grader_mode=full 时由维护者本地生成并随代码提交
#   （见 benchmark/baselines/README.md）。CI 只读不写，绝不把 degraded
#   结果写入基线；grader_mode 不一致时 regression 自带 warn 门禁。
#
# 无 secrets 依赖（PR 门禁不得引入 secrets）。
name: smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: smoke + regression gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure fixtures exist (offline, deterministic)
        # smoke 的 6 题均由 fixture 驱动；缺失时确定性生成（零网络）。
        run: kaoyanbench fixtures build

      - name: Check generated artifacts (snapshots, deterministic)
        # P2：快照库由生成器 deterministic 产出；漂移即失败。
        # 注意：私测题不在公开仓库中（见 benchmark/tasks/private/README.md），
        # 故此处不跑 build_private_tasks.py --check；私测维护者在受控环境执行。
        run: |
          python tools/build_snapshots.py --check

      - name: Run smoke (mock, offline)
        run: |
          kaoyanbench run --suite smoke --agent mock --tag "ci-${{ github.run_id }}"

      - name: Generate reports (json/markdown/html/csv)
        run: |
          kaoyanbench report --suite smoke --agent mock \
            --tag "ci-${{ github.run_id }}" \
            -f json,markdown,html,csv

      - name: Regression gate (FAIL 即 job 失败)
        # 基线入库于 benchmark/baselines/（版本化，CI 只读不写）。
        # ★ P0 教训：baseline 缺失时严禁静默自比对，必须显红失败（退出码 2），
        #   绝不以同 tag 自比对制造「恒绿」假门禁。
        run: |
          set -euo pipefail
          BASE_FILE="benchmark/baselines/smoke__mock__baseline.suite.json"
          CURRENT_TAG="ci-${{ github.run_id }}"
          if [ ! -f "$BASE_FILE" ]; then
            echo "::error:: 回归基线缺失（$BASE_FILE）。基线必须随代码提交入库，CI 不做自比对、不写基线。更新流程见 benchmark/baselines/README.md。"
            exit 2
          fi
          # 把入库基线拷入 results/suites/ 以便 store 能按 tag 加载
          mkdir -p results/suites
          cp "$BASE_FILE" "results/suites/smoke__mock__baseline.suite.json"
          echo "baseline=baseline current=$CURRENT_TAG"
          kaoyanbench regression --baseline baseline --current "$CURRENT_TAG" \
            --suite smoke --agent mock
          # 退出码由 set -e 保证：0 pass / 1 gate fail（→ job 失败）/ 2 错误

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports-${{ github.run_id }}
          path: |
            reports/
            results/suites/
          if-no-files-found: warn
          retention-days: 14
