# validate.yml —— PR / push 门禁（任务 C-04，DoD ★12）
# 内容：安装（editable）+ pytest + kaoyanbench validate --suite core50
# 特性：
#   * 完全离线：不访问网络（除 actions 自身下载），无 secrets。
#   * matrix：Python 3.10 / 3.11 / 3.12。
#   * core50 的 validate 只做 schema + fixture hash 校验，不跑 Agent，秒级完成。
# 设计依据：方案第 7.1 节 C-04、第 5.10 节 CLI 契约、R5（core50 不进 PR 门禁的「运行」层）。
name: validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

# 同一分支的重复触发互相取消，节省 CI 资源。
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, zero runtime deps)
        # 核心路径零第三方依赖；dev extra 含 pytest（测试运行器）+ pyyaml/fpdf2/openpyxl。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show version
        run: kaoyanbench --version

      - name: Pytest
        # 310+ 用例，零网络依赖。
        run: python -m pytest tests/ -q

      - name: Validate core50 (schema + fixture hash + snapshot gate, offline)
        # P2：快照已补齐，缺快照即 error（--require-snapshots）。
        run: kaoyanbench validate --suite core50 --require-snapshots

      - name: Anti-echo probe (基准可判别性，echo 通过率 ≤8%)
        # P1-2：只会「回显题面」的 echo Agent 不得刷分（防判定词泄漏回潮）。
        # echo 跑 core50 50 题纯本地、秒级，成本可忽略。阈值依据 docs/02 §6.2。
        run: |
          kaoyanbench run --suite core50 --agent echo --tag echo-probe
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/suites/core50__echo__echo-probe.suite.json")
          if not p.is_file():
              print(f"::error:: anti-echo 探针结果缺失：{p}")
              sys.exit(2)
          agg = json.loads(p.read_text(encoding="utf-8")).get("aggregates") or {}
          rate = agg.get("task_success_rate")
          if rate is None:
              print("::error:: anti-echo 探针无法读取 task_success_rate")
              sys.exit(2)
          print(f"echo 通过率 = {rate:.1%}（红线 ≤8%，即最多 4/50）")
          if rate > 0.08:
              print(f"::error:: echo 通过率 {rate:.1%} 超过 8% 上界，疑似判定词泄漏进题面（见 docs/02 §6.2）")
              sys.exit(1)
          PY
